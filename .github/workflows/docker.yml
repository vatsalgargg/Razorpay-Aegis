name: Docker — Container Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-container:
    name: Build & Verify Docker Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: razorpay-aegis:latest

      - name: Run Container & Verify Health
        run: |
          docker run -d --name test-aegis -p 8000:8000 -e GROQ_API_KEY="" -e GEMINI_API_KEY="" razorpay-aegis:latest
          for i in {1..20}; do
            if curl -s http://localhost:8000/health | grep -q "status"; then
              echo "Gateway container healthy and responding!"
              curl -s http://localhost:8000/dashboard > /dev/null
              docker stop test-aegis
              exit 0
            fi
            echo "Waiting for container to boot... ($i/20)"
            sleep 2
          done
          echo "Container startup timed out."
          docker logs test-aegis
          exit 1
