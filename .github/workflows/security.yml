name: Security — DevSecOps & Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  security-audit:
    name: Secrets, SAST & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit -r requirements.txt

      - name: Static Application Security Testing (Bandit)
        run: |
          bandit -r api data detection gateway reasoning -s B104,B301 --exclude ./tests || true

      - name: Dependency Vulnerability Audit (Pip-Audit)
        run: |
          pip-audit --desc on || true
